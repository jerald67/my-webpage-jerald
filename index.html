<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Modern Landing Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    header {
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        font-size: 20px;
        letter-spacing: 2px;
    }

    nav a {
        color: #cbd5e1;
        margin-left: 20px;
        text-decoration: none;
        transition: 0.3s;
    }

    nav a:hover {
        color: white;
    }

    .hero {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 60px 20px;
    }

    .hero h2 {
        font-size: 48px;
        margin-bottom: 15px;
        animation: fadeIn 1s ease-in-out;
    }

    .hero p {
        font-size: 18px;
        color: #cbd5e1;
        max-width: 600px;
        margin: auto;
        animation: fadeIn 1.5s ease-in-out;
    }

    .btn {
        margin-top: 25px;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: #3b82f6;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn:hover {
        background: #2563eb;
        transform: scale(1.05);
    }

    .section {
        padding: 60px 20px;
        text-align: center;
    }

    .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }

    .card {
        background: rgba(255,255,255,0.05);
        padding: 20px;
        border-radius: 12px;
        width: 250px;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        background: rgba(255,255,255,0.1);
    }

    footer {
        text-align: center;
        padding: 20px;
        color: #94a3b8;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
        .hero h2 {
            font-size: 32px;
        }

        nav {
            display: none;
        }
    }
</style>
</head>

<body>

<header>
    <h1>MY SITE</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#features">Features</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <h2>Build Something Amazing</h2>
        <p>A modern, responsive landing page built with pure HTML, CSS, and JavaScript in a single file.</p>
        <button class="btn" onclick="showMessage()">Get Started</button>
    </div>
</section>

<section class="section" id="features">
    <h2>Features</h2>
    <div class="cards">
        <div class="card">⚡ Fast & Lightweight</div>
        <div class="card">📱 Fully Responsive</div>
        <div class="card">🎨 Clean Design</div>
    </div>
</section>

<section class="section" id="contact">
    <h2>Contact</h2>
    <p style="margin-top:10px; color:#cbd5e1;">Click the button to test interactivity.</p>
</section>

<footer>
    © 2026 My Modern Web Page
</footer>

<script>
    function showMessage() {
        alert("Welcome! Your page is working 🚀");
    }

    // Smooth scroll effect
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function(e) {
            e.preventDefault();
            document.querySelector(this.getAttribute("href")).scrollIntoView({
                behavior: "smooth"
            });
        });
    });
</script>

</body>
</html>
